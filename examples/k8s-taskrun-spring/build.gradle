plugins {
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'io.slin.secrets'   // no version, comes from the included build
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
}

// k8s source, injected as environment variables into bootRun.
// Default variable name is the data key of the secret (here: test).
slinSecrets {
    tasks = ['bootRun']
    k8sSecrets {
        secret { namespace = 'kuma-v2'; name = 'test-secret' }
    }
}
