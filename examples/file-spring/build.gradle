plugins {
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'io.slin.secrets'   // no version, comes from the included build
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
}

// Write the secrets into a properties file. The application reads the file via
// spring.config.import. No environment injection here.
slinSecrets {
    useFile = true
    fileFormat = 'properties'
    k8sSecrets {
        secret { namespace = 'kuma-v2'; name = 'test-secret' }
    }
}

// Refresh the file before running (respects maxAge).
tasks.named('bootRun') {
    dependsOn 'syncSecretsFile'
}
